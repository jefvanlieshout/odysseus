[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-brain"
version = "0.3.0.dev0"
description = "Evidence-backed semantic + episodic memory authority for the assistant stack"
requires-python = ">=3.11"

[project.scripts]
brain-foundation = "jarvis_brain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis_brain*"]


[project.optional-dependencies]
vector = [
    "chromadb==1.5.9",
    "fastembed==0.8.0",
]
dev = []
