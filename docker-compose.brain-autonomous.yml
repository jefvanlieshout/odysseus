services:
  odysseus:
    environment:
      ASSISTANT_BRAIN_MODE: recall
      ASSISTANT_BRAIN_CAPTURE_ENABLED: "true"
      ASSISTANT_BRAIN_RECALL_ENABLED: "true"
      ASSISTANT_BRAIN_CONTROL_ENABLED: "true"
      JARVIS_BRAIN_URL: http://jarvis-brain:8765
      JARVIS_BRAIN_API_KEY: ${JARVIS_BRAIN_API_KEY}
      ASSISTANT_BRAIN_TIMEOUT_SECONDS: "0.75"
      ASSISTANT_BRAIN_RECALL_TIMEOUT_SECONDS: "2.0"
      ASSISTANT_BRAIN_RECALL_MAX_ITEMS: "6"
      ASSISTANT_BRAIN_RECALL_MAX_CHARS: "2800"
      ASSISTANT_BRAIN_DEFAULT_OWNER: local
    volumes:
      - ./src:/app/src:ro,z
      - ./assistant:/app/assistant:ro,z
      - ./routes:/app/routes:ro,z
      - ./core:/app/core:ro,z
    depends_on:
      jarvis-brain:
        condition: service_started

  qwen-analyzer:
    container_name: jarvis-qwen-analyzer
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b10236@sha256:c76ef7b03c2f6bf74176344ed97caefb40c2ec3cadc15b419fbc69fdd4b97497
    entrypoint:
      - /app/llama-server
    command:
      - --model
      - /models/Qwen3.8-27B-Q4_K_M.gguf
      - --alias
      - Qwen/Qwen3.8-27B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "32000"
      - --flash-attn
      - auto
      - --fit
      - "off"
    volumes:
      - ${APP_DATA_DIR:-./data}/huggingface/hub/models--Qwen--Qwen3.8-27B/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/Qwen3.8-27B-Q4_K_M.gguf:/models/Qwen3.8-27B-Q4_K_M.gguf:ro,z
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 15s
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - default

  qwen-loopback-proxy:
    container_name: jarvis-qwen-loopback-proxy
    build:
      context: ./jarvis-brain
      dockerfile: Dockerfile
    entrypoint:
      - python
      - -u
      - /opt/jarvis/qwen_loopback_proxy.py
    environment:
      QWEN_PROXY_TARGET_HOST: qwen-analyzer
      QWEN_PROXY_TARGET_PORT: "8000"
      QWEN_PROXY_LISTEN_HOST: 0.0.0.0
      QWEN_PROXY_LISTEN_PORT: "8000"
    volumes:
      - ./jarvis-brain/scripts/qwen_loopback_proxy.py:/opt/jarvis/qwen_loopback_proxy.py:ro,z
    network_mode: "service:odysseus"
    restart: unless-stopped
    depends_on:
      odysseus:
        condition: service_started
      qwen-analyzer:
        condition: service_healthy

  jarvis-brain:
    container_name: jarvis-brain-shadow
    build:
      context: ./jarvis-brain
      dockerfile: Dockerfile
    environment:
      JARVIS_BRAIN_API_KEY: ${JARVIS_BRAIN_API_KEY}
      BRAIN_DB_PATH: /data/brain.db
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: "8765"
      BRAIN_VECTOR_BACKEND: chroma
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      BRAIN_EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      BRAIN_EMBED_CACHE: /data/fastembed-cache
      BRAIN_CHROMA_SEMANTIC_COLLECTION: jarvis_brain_shadow_semantic_v1
      BRAIN_CHROMA_EPISODIC_COLLECTION: jarvis_brain_shadow_episodic_v1
    volumes:
      - jarvis-brain-shadow-data:/data
    restart: unless-stopped
    depends_on:
      - chromadb
    networks:
      - default

  jarvis-brain-worker:
    container_name: jarvis-brain-semantic-worker
    build:
      context: ./jarvis-brain
      dockerfile: Dockerfile
    command: ["python", "-m", "jarvis_brain.worker_daemon"]
    environment:
      BRAIN_DB_PATH: /data/brain.db
      BRAIN_VECTOR_BACKEND: chroma
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      BRAIN_EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      BRAIN_EMBED_CACHE: /data/fastembed-cache
      BRAIN_CHROMA_SEMANTIC_COLLECTION: jarvis_brain_shadow_semantic_v1
      BRAIN_CHROMA_EPISODIC_COLLECTION: jarvis_brain_shadow_episodic_v1

      # Brain's analyzer is lifecycle-independent from Gwen/Odysseus.
      # The worker reaches the dedicated official llama.cpp service over the
      # normal Compose network instead of sharing Odysseus' network namespace.
      BRAIN_LLM_URL: ${BRAIN_LLM_URL:-http://qwen-analyzer:8000/v1/chat/completions}
      BRAIN_LLM_MODEL: ${BRAIN_LLM_MODEL:-Qwen/Qwen3.8-27B}
      BRAIN_LLM_TIMEOUT_SECONDS: ${BRAIN_LLM_TIMEOUT_SECONDS:-120}
      BRAIN_LLM_MAX_TOKENS: ${BRAIN_LLM_MAX_TOKENS:-900}
      BRAIN_LLM_TEMPERATURE: ${BRAIN_LLM_TEMPERATURE:-0}
      BRAIN_LLM_REASONING_EFFORT: ${BRAIN_LLM_REASONING_EFFORT:-medium}
      BRAIN_LLM_READY_URL: ${BRAIN_LLM_READY_URL:-http://qwen-analyzer:8000/v1/models}
      BRAIN_LLM_READY_TIMEOUT_SECONDS: ${BRAIN_LLM_READY_TIMEOUT_SECONDS:-2}
      BRAIN_LLM_UNAVAILABLE_POLL_SECONDS: ${BRAIN_LLM_UNAVAILABLE_POLL_SECONDS:-10}

      BRAIN_WORKER_POLL_SECONDS: ${BRAIN_WORKER_POLL_SECONDS:-2}
      BRAIN_WORKER_ERROR_BACKOFF_SECONDS: ${BRAIN_WORKER_ERROR_BACKOFF_SECONDS:-5}
      BRAIN_WORKER_LEASE_SECONDS: ${BRAIN_WORKER_LEASE_SECONDS:-300}
      BRAIN_WORKER_MAX_CONSECUTIVE_JOBS: ${BRAIN_WORKER_MAX_CONSECUTIVE_JOBS:-8}
    volumes:
      - jarvis-brain-shadow-data:/data
    networks:
      - default
    restart: unless-stopped
    depends_on:
      qwen-analyzer:
        condition: service_healthy
      jarvis-brain:
        condition: service_started
      chromadb:
        condition: service_started

volumes:
  jarvis-brain-shadow-data:
