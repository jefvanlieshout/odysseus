name: assistant-stack

services:
  assistant-events:
    build:
      context: ./assistant/events
      dockerfile: Dockerfile
    env_file:
      # Reuse the existing Telegram token/allowlist. This service only sends
      # Bot API messages; it never starts a second Telegram poller.
      - ./assistant/telegram/.env
      - ./assistant/events/.env
    environment:
      - ASSISTANT_IDENTITY_PATH=/config/identity.toml
    volumes:
      - assistant-events-data:/data
      - ./assistant/config/identity.toml:/config/identity.toml:ro
    ports:
      - "127.0.0.1:8780:8780"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  assistant-events-data:
